name: Ghost migration checks

on:
  pull_request:
    paths:
      - "ghost/**"
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "react-router.config.*"
      - ".github/workflows/ghost.yml"

permissions:
  contents: read

jobs:
  ghost:
    name: Export, validate, and package Ghost
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test contact service
        run: npm --prefix ghost/contact-service ci && npm --prefix ghost/contact-service test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Export editable Ghost content
        run: npm run ghost:export

      - name: Verify migration routes and content
        run: |
          npm run ghost:verify
          npm run ghost:verify-export

      - name: Test reusable page components
        run: node --test ghost/tests/*.test.mjs

      - name: Validate Ghost theme
        run: npm run ghost:gscan

      - name: Package Ghost theme
        run: npm run ghost:package-theme

      - name: Upload Ghost migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-migration-${{ github.event.pull_request.number }}
          path: |
            ghost/content/export/zenphry-content.json
            ghost/content/export/zenphry-ghost-theme.zip
            ghost/routes.yaml
            ghost/redirects.yaml
          if-no-files-found: error
          retention-days: 7
