/* Colors and motion as variables \u2013 override them on .ui-buttonc (see Theming in the docs) */
.ui-buttonc {
  --ui-btnc-title: #000;
  --ui-btnc-ink: rgba(0, 0, 0, 0.88);
  --ui-btnc-muted: rgba(0, 0, 0, 0.61);
  --ui-btnc-icon: rgba(0, 0, 0, 0.447);
  --ui-btnc-solid: rgba(0, 0, 0, 0.88);
  --ui-btnc-solid-hover: rgba(0, 0, 0, 0.8);
  --ui-btnc-on-solid: #fcfcfc;
  --ui-btnc-surface: #ffffff;
  --ui-btnc-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 1px 1px -1px rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --ui-btnc-shadow-hover: 0 0 0 0.5px rgba(0, 0, 0, 0.1), 0 1px 1px -1px rgba(0, 0, 0, 0.12), 0 1px 3px 0 rgba(0, 0, 0, 0.07);
  --ui-btnc-wash: rgba(0, 0, 0, 0.03);
  --ui-btnc-danger: #e5484d;
  --ui-btnc-danger-bg: rgba(229, 72, 77, 0.08);
  --ui-btnc-danger-bg-hover: rgba(229, 72, 77, 0.12);
  --ui-btnc-shine: rgba(255, 255, 255, 0.82);
  --ui-btnc-shine-on-solid: #ffffff;
  --ui-btnc-focus: rgba(0, 96, 226, 0.35);
  --ui-btnc-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ui-btnc-load: 650ms;

  --h: 28px;
  --px: 10px;
  --gap: 6px;
  --fs: 13px;
  --lh: 20px;
  --icon: 16px;
  --radius: 6px;

  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--gap);
  box-sizing: border-box;
  height: var(--h);
  padding: 0 var(--px);
  margin: 0;
  border: 0;
  border-radius: var(--radius);
  font-family: "Inter", "InterVariable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: var(--fs);
  font-weight: 500;
  line-height: var(--lh);
  letter-spacing: 0;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  transition:
    background-color 140ms ease,
    color 140ms ease,
    box-shadow 140ms ease,
    transform 160ms var(--ui-btnc-ease),
    opacity 140ms ease;
}

/* Sizes: 24 \xB7 28 \xB7 32 high */
.ui-buttonc[data-size="sm"] {
  --h: 24px;
  --px: 8px;
  --gap: 4px;
  --fs: 12px;
  --lh: 16px;
  --icon: 14px;
  --radius: 6px;
}
.ui-buttonc[data-size="lg"] {
  --h: 32px;
  --px: 12px;
  --gap: 6px;
  --fs: 13px;
  --icon: 16px;
  --radius: 6px;
}
/* An icon sits closer to the edge than the text, so both look evenly spaced */
.ui-buttonc[data-icon-left] {
  padding-left: calc(var(--px) - 2px);
}
.ui-buttonc[data-icon-right] {
  padding-right: calc(var(--px) - 2px);
}
.ui-buttonc[data-icon-only] {
  width: var(--h);
  padding: 0;
}

/* primary: a dark chip */
.ui-buttonc[data-variant="primary"] {
  background: var(--ui-btnc-solid);
  color: var(--ui-btnc-on-solid);
}
.ui-buttonc[data-variant="primary"]:hover:not(:disabled) {
  background: var(--ui-btnc-solid-hover);
}

/* secondary: white with the card's hairline shadow */
.ui-buttonc[data-variant="secondary"] {
  background: var(--ui-btnc-surface);
  color: var(--ui-btnc-title);
  box-shadow: var(--ui-btnc-shadow);
}
.ui-buttonc[data-variant="secondary"] .ui-buttonc__icon {
  color: var(--ui-btnc-icon);
}
.ui-buttonc[data-variant="secondary"]:hover:not(:disabled) {
  box-shadow: var(--ui-btnc-shadow-hover);
}

/* ghost: a muted label, a soft wash appears on hover */
.ui-buttonc[data-variant="ghost"] {
  background: transparent;
  color: var(--ui-btnc-muted);
}
.ui-buttonc[data-variant="ghost"] .ui-buttonc__icon {
  color: var(--ui-btnc-icon);
}
.ui-buttonc[data-variant="ghost"]:hover:not(:disabled) {
  background: var(--ui-btnc-wash);
  color: var(--ui-btnc-ink);
}
.ui-buttonc[data-variant="ghost"]:hover:not(:disabled) .ui-buttonc__icon {
  color: var(--ui-btnc-ink);
}

/* destructive: red label on a minimal red fill, no stroke */
.ui-buttonc[data-variant="destructive"] {
  background: var(--ui-btnc-danger-bg);
  color: var(--ui-btnc-danger);
}
.ui-buttonc[data-variant="destructive"]:hover:not(:disabled) {
  background: var(--ui-btnc-danger-bg-hover);
}

.ui-buttonc .ui-buttonc__icon {
  transition: color 140ms ease;
}
.ui-buttonc:active:not(:disabled):not([data-loading]) {
  transform: scale(0.97);
}
.ui-buttonc:focus-visible {
  outline: 2px solid var(--ui-btnc-focus);
  outline-offset: 1px;
}
.ui-buttonc:disabled {
  opacity: 0.4;
  cursor: default;
}
.ui-buttonc[data-loading] {
  cursor: default;
}

.ui-buttonc__icon {
  display: grid;
  place-items: center;
  flex: none;
  width: var(--icon);
  height: var(--icon);
}
.ui-buttonc__icon > svg {
  width: 100%;
  height: 100%;
}

/* Morph: the button clips while its width glides; changed parts blur in */
.ui-buttonc {
  overflow: clip;
}
.ui-buttonc[data-ready] .ui-buttonc__label {
  animation: ui-buttonc-label-in 480ms cubic-bezier(0.25, 1, 0.5, 1) both;
}
.ui-buttonc[data-ready] .ui-buttonc__icon {
  animation: ui-buttonc-icon-in 520ms cubic-bezier(0.25, 1, 0.5, 1) both;
}

/* Loading: a light band sweeps across a copy of the dimmed label */
.ui-buttonc__label {
  position: relative;
}
.ui-buttonc__label::after {
  content: attr(data-text);
  content: attr(data-text) / "";
  position: absolute;
  inset: 0;
  white-space: nowrap;
  color: transparent;
  background: linear-gradient(90deg, transparent 38%, var(--ui-btnc-shine) 50%, transparent 62%) 100% 0 / 300% 100%
    no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  opacity: 0;
  pointer-events: none;
}
.ui-buttonc[data-variant="primary"] .ui-buttonc__label::after {
  --ui-btnc-shine: var(--ui-btnc-shine-on-solid);
}
.ui-buttonc[data-loading] .ui-buttonc__label {
  color: color-mix(in srgb, currentColor 50%, transparent);
}
.ui-buttonc[data-loading] .ui-buttonc__label::after {
  opacity: 1;
  animation: ui-buttonc-sweep calc(var(--ui-btnc-load) * 1.6) linear infinite;
}
.ui-buttonc__spinner {
  animation: ui-buttonc-spin 900ms linear infinite;
}

@keyframes ui-buttonc-label-in {
  from {
    opacity: 0;
    filter: blur(3px);
    transform: translateY(25%);
  }
}
@keyframes ui-buttonc-icon-in {
  from {
    opacity: 0;
    filter: blur(2px);
    transform: scale(0.7);
  }
}

@keyframes ui-buttonc-spin {
  to {
    transform: rotate(1turn);
  }
}

@keyframes ui-buttonc-sweep {
  from {
    background-position: 100% 0;
  }
  to {
    background-position: 0% 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ui-buttonc[data-ready] .ui-buttonc__label,
  .ui-buttonc[data-ready] .ui-buttonc__icon {
    animation: none;
  }
  .ui-buttonc {
    transition-duration: 1ms;
  }
  .ui-buttonc[data-loading] .ui-buttonc__label::after {
    animation: none;
    opacity: 0;
  }
}

}

.ui-if {
  /* Stage background and the color the bottom fades into */
  --ui-if-bg: #ffffff;
  --ui-if-fade: #ffffff;

  --ui-if-step: .9s;
  --ui-if-sweep: 1.1s;

  width: 100%;

  background: var(--ui-if-bg);
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;

.ui-if-blob {
  position: absolute;
  transform: rotate(var(--rot));
  animation: ui-if-drift var(--dur) var(--delay) infinite linear,
             ui-if-breathe var(--fdur) var(--fdelay) infinite ease-in-out;

.ui-if-paused .ui-if-blob,

/* Travel and turn only (no scale or skew, which makes the huge layers re-rasterize).
   A square path: every leg has the same length, so the drift speed stays even. */
@keyframes ui-if-drift {
  0%, 100% { transform: rotate(var(--rot)) translate(0, 0); }
  25%      { transform: rotate(calc(var(--rot) + var(--r1))) translate(var(--dx), var(--dy)); }
  50%      { transform: rotate(var(--rot)) translate(calc(var(--dx) - var(--dy)), calc(var(--dy) + var(--dx))); }
  75%      { transform: rotate(calc(var(--rot) - var(--r1))) translate(calc(var(--dy) * -1), var(--dx)); }
}
@keyframes ui-if-breathe {
  0%, 100% { opacity: var(--o-lo); }
  50%      { opacity: var(--o-hi); }
}

/* ---------- Connection beam: sweeps from the centre pill to the hub, clipped to the gap ---------- */
.ui-if-link {
  position: absolute;
  left: 779.639px;
  top: 597px;
  width: 240.361px;
  height: 3px;
  clip-path: inset(-80px 0px -80px 0px);
}
.ui-if-beam {
  position: absolute;
  left: 0;
  width: 150px;
  opacity: 0;
  transform: translateX(240px);
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 40%,
              rgba(255, 255, 255, 1) 55%, rgba(255, 255, 255, 0.08) 100%);
}
.ui-if-beam--core { top: 0; height: 3px; }
.ui-if-beam--glow { top: -2px; height: 5px; filter: blur(3px); }
.ui-if-sweeping .ui-if-beam--core { animation: ui-if-sweep var(--ui-if-sweep) var(--ui-if-sweep-ease) both; }
.ui-if-sweeping .ui-if-beam--glow { animation: ui-if-sweep-glow var(--ui-if-sweep) var(--ui-if-sweep-ease) both; }
@keyframes ui-if-sweep {
  0%   { transform: translateX(241px); opacity: 0; }
  18%  { opacity: 1; }
  72%  { opacity: 1; }
  100% { transform: translateX(-155px); opacity: 0; }
}
@keyframes ui-if-sweep-glow {
  0%   { transform: translateX(241px); opacity: 0; filter: blur(3px); }
  18%  { opacity: .9; filter: blur(7.1px); }
  72%  { opacity: .9; filter: blur(7.1px); }
  100% { transform: translateX(-155px); opacity: 0; filter: blur(3px); }
}

/* ---------- Dashed orbit ---------- */
.ui-if-orbit {
  position: absolute;
  left: 1100.25px;
  top: -178.5px;
  width: 1519.5px;
  height: 1557.75px;
  display: block;
  overflow: visible;
  pointer-events: none;
}

/* ---------- Bottom fade, in stage coordinates ---------- */
.ui-if-fade {
  position: absolute;
  left: 0;
  /* Runs a little past the bottom edge and is solid before it, so no sliver of the blobs shows at small scales */
  bottom: -12px;
  width: 2400px;
  height: 612px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ui-if-fade) 0%, transparent) 0%, var(--ui-if-fade) 94%);
  pointer-events: none;
}

/* ---------- Charged state: a blurred white silhouette behind the card plus a white sheen on it ---------- */
.ui-if-glow {
  position: absolute;
  top: 520.6797px;
  height: 158.639px;
  border-radius: 3600px;
  filter: blur(21.94px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .55s ease-out;
}
.ui-if-glow.ui-if-on { opacity: 1; transition: opacity .5s ease-in; }
.ui-if-glow--out {
  left: 1020px;
  width: 492.639px;
  background: linear-gradient(90deg, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
}
.ui-if-glow--in {
  left: 137px;
  width: 642.639px;
  background: linear-gradient(270deg, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
}

/* ---------- Card ---------- */
.ui-if-card {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 20px;
  border-radius: 3600px;
  -webkit-backdrop-filter: blur(26.55px);
  backdrop-filter: blur(26.55px);
}
.ui-if-card--icon-left { padding: 20px 80px 20px 20px; }
.ui-if-hub { left: 137px; top: 520.6797px; padding: 20px 20px 20px 60px; }
.ui-if-card--light {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 16px 36px 0 rgba(0, 0, 0, 0.06);
}

.ui-if-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  transition: opacity var(--ui-if-step) var(--ui-if-step-ease);
}
.ui-if-bg--charge { opacity: 0; box-shadow: none; transition: opacity .55s ease-out; }
.ui-if-bg--charge-out { background: linear-gradient(90deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%); }
.ui-if-bg--charge-in { background: linear-gradient(270deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%); }
/* Of the rotating pills only the one in the centre reacts */
.ui-if-pills.ui-if-charged .ui-if-pill[data-phase="3"] .ui-if-bg--charge,
.ui-if-hub.ui-if-charged .ui-if-bg--charge { opacity: 1; transition: opacity .5s ease-in; }

/* ---------- Badge ---------- */
.ui-if-badge {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  width: 118.639px;
  height: 118.639px;
}
.ui-if-ring {
  position: absolute;
  inset: 0;
  width: 118.639px;
  height: 118.639px;
  display: block;
  overflow: visible;
}
.ui-if-icon {
  position: absolute;
  left: 27.32px;
  top: 27.32px;
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
}
.ui-if-icon > svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- Label ---------- */
.ui-if-label {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
  flex: 0 0 auto;
  white-space: nowrap;
  width: 254px;
}
.ui-if-label--right {
  align-items: flex-end;
  justify-content: center;
  text-align: right;
  width: 424px;
}
/* Inter runs ~10% wider than the SF Pro of the design: slightly smaller and tighter, so the cards keep their exact widths */
.ui-if-title { display: block; font-size: 37px; line-height: 40px; letter-spacing: -0.02em; font-weight: 400; }
.ui-if-sub { display: block; font-size: 33.5px; line-height: 36px; letter-spacing: -0.02em; font-weight: 380; }
.ui-if-hub .ui-if-title { color: rgba(0, 0, 0, 0.8); }
.ui-if-hub .ui-if-sub { color: rgba(0, 0, 0, 0.4); }

/* ---------- Rotating pills: all share the centre slot and move by transform ---------- */
.ui-if-pill {
  left: 1020px;
  top: 520.6797px;
  will-change: transform;
  transition: transform var(--ui-if-step) var(--ui-if-step-ease), opacity var(--ui-if-step) var(--ui-if-step-ease);
}
/* The staging slot is reached by an invisible jump from the exit, so it never animates */
.ui-if-pill[data-phase="0"] { transform: translate(480px, -845.68px); opacity: 0; transition: none; }
.ui-if-pill[data-phase="1"] { transform: translate(240px, -562.68px); opacity: 1; }
.ui-if-pill[data-phase="2"] { transform: translate(80px, -279.68px); opacity: 1; }
.ui-if-pill[data-phase="3"] { transform: translate(0px, 0px); opacity: 1; }
.ui-if-pill[data-phase="4"] { transform: translate(80px, 279.32px); opacity: 1; }
.ui-if-pill[data-phase="5"] { transform: translate(240px, 558.32px); opacity: 1; }
.ui-if-pill[data-phase="6"] { transform: translate(480px, 838.32px); opacity: 0; }

/* Backgrounds cross-fade between the passing (ghost) and the centre (light) styling */
.ui-if-bg--ghost {
  opacity: 1;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.08) 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
}
.ui-if-bg--light {
  opacity: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 16px 36px 0 rgba(0, 0, 0, 0.06);
}
.ui-if-pill[data-phase="3"] .ui-if-bg--ghost { opacity: 0; }
.ui-if-pill[data-phase="3"] .ui-if-bg--light { opacity: 1; }

.ui-if-pill .ui-if-ring { transition: opacity var(--ui-if-step) var(--ui-if-step-ease); }
.ui-if-pill .ui-if-ring--ghost { opacity: 1; }
.ui-if-pill .ui-if-ring--light { opacity: 0; }
.ui-if-pill[data-phase="3"] .ui-if-ring--ghost { opacity: 0; }
.ui-if-pill[data-phase="3"] .ui-if-ring--light { opacity: 1; }

.ui-if-pill .ui-if-title,
.ui-if-pill .ui-if-sub { transition: color var(--ui-if-step) var(--ui-if-step-ease); }
.ui-if-pill .ui-if-title { color: rgba(255, 255, 255, 0.8); }
.ui-if-pill .ui-if-sub { color: rgba(255, 255, 255, 0.4); }
.ui-if-pill[data-phase="3"] .ui-if-title { color: rgba(0, 0, 0, 0.8); }
.ui-if-pill[data-phase="3"] .ui-if-sub { color: rgba(0, 0, 0, 0.4); }

/* Logos: knocked out to white while passing; in the centre back to their own colors,
   single-color logos turn black. The same filter list everywhere so it interpolates. */
.ui-if-pill .ui-if-icon {
  filter: brightness(0) invert(1);
  transition: filter var(--ui-if-step) var(--ui-if-step-ease);
}
.ui-if-pill[data-phase="3"] .ui-if-icon { filter: brightness(1) invert(0); }
.ui-if-pill[data-phase="3"][data-fill="black"] .ui-if-icon { filter: brightness(0) invert(0); }

/* ---------- Reduced motion: the centre state, standing still, with the beam drawn in ---------- */
@media (prefers-reduced-motion: reduce) {
  .ui-if-pill, .ui-if-bg, .ui-if-ring, .ui-if-icon, .ui-if-title, .ui-if-sub { transition: none; }
  .ui-if-blob { animation: none; }
  .ui-if-beam { opacity: 1; transform: translateX(45px); }
}

:where(.dark, [data-theme="dark"]) .ui-if { --ui-if-bg: #1f1f21; --ui-if-fade: #1f1f21; }
:where(.dark, [data-theme="dark"]) .ui-if-blobs { opacity: .8; }

:where(.dark, [data-theme="dark"]) .ui-if-orbit-stop { stop-color: #ffd9cc; }
:where(.dark, [data-theme="dark"]) .ui-if-glow { filter: blur(21.94px) opacity(.45); }
:where(.dark, [data-theme="dark"]) .ui-if-card--light,
:where(.dark, [data-theme="dark"]) .ui-if-bg--light {

}

}

.ui-pp {
  --ui-pp-bg: #f5f5f5;
  --ui-pp-card: #fdfdfd;
  --ui-pp-line: rgba(23, 23, 23, 0.08);
  --ui-pp-ink: #171717;
  --ui-pp-text: #525252;
  --ui-pp-muted: #8f8f8f;
  --ui-pp-faint: #b5b5b5;
  --ui-pp-accent: #2f6bff;
  --ui-pp-accent-text: #2f6bff;
  --ui-pp-accent-soft: #eef3ff;
  --ui-pp-featured-line: rgba(47, 107, 255, 0.28);
  --ui-pp-featured-glow: rgba(47, 107, 255, 0.06);
  --ui-pp-track: #ebebeb;
  --ui-pp-thumb: #fff;
  --ui-pp-thumb-shadow: 0 0 0 1px rgba(23, 23, 23, 0.06), 0 1px 3px rgba(23, 23, 23, 0.1);
  --ui-pp-wash: rgba(23, 23, 23, 0.05);
  --ui-pp-cta: var(--ui-pp-ink);
  --ui-pp-cta-hover: #2a2a2a;
  --ui-pp-on-cta: #fdfdfd;
  --ui-pp-cta-shadow: 0 0 0 1px var(--ui-pp-ink), 0 1px 3px rgba(23, 23, 23, 0.08), inset 0 -1px 0 rgba(253, 253, 253, 0.12);
  --ui-pp-tile: #fff;
  --ui-pp-tile-line: rgba(23, 23, 23, 0.1);
  --ui-pp-tile-filled-line: rgba(0, 0, 0, 0.06);
  --ui-pp-ease: cubic-bezier(0.22, 1, 0.36, 1);
  box-sizing: border-box;
  width: 100%;
  padding: 48px 16px 56px;
  background: var(--ui-pp-bg);
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ui-pp-ink);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
.ui-pp *, .ui-pp *::before, .ui-pp *::after { box-sizing: border-box; }
.ui-pp button {
  margin: 0;
  border: 0;
  background: none;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.ui-pp button:focus-visible {
  outline: 2px solid var(--ui-pp-accent);
  outline-offset: 2px;
}

.ui-pp__head { text-align: center; }
.ui-pp__title {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  line-height: 26px;
  letter-spacing: -0.02em;
}
.ui-pp__subtitle {
  margin: 6px 0 0;
  font-size: 16px;
  line-height: 22px;
  color: var(--ui-pp-muted);
}

/* Monthly / yearly switch with a sliding thumb */
.ui-pp__switch {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  width: fit-content;
  margin: 20px auto 0;
  padding: 3px;
  border-radius: 10px;
  background: var(--ui-pp-track);
}
.ui-pp__thumb {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc(50% - 3px);
  border-radius: 8px;
  background: var(--ui-pp-thumb);
  box-shadow: var(--ui-pp-thumb-shadow);
  transition: transform 380ms var(--ui-pp-ease);
}
.ui-pp__switch[data-billing="yearly"] .ui-pp__thumb { transform: translateX(100%); }
.ui-pp__option {
  position: relative;
  min-width: 68px;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  font-size: 14px !important;
  line-height: 20px;
  color: var(--ui-pp-muted) !important;
  transition: color 240ms ease;
}
.ui-pp__option[aria-checked="true"] { color: var(--ui-pp-ink) !important; }

.ui-pp__plans {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
  max-width: 1152px;
  margin: 24px auto 0;
}
@media (max-width: 860px) {
  .ui-pp__plans { grid-template-columns: minmax(0, 1fr); max-width: 420px; }
}

.ui-pp__card {
  padding: 16px;
  background: var(--ui-pp-card);
  border: 1px solid var(--ui-pp-line);
  border-radius: 14px;
}
.ui-pp__card[data-featured] {
  border-color: var(--ui-pp-featured-line);
  box-shadow: 0 0 0 3px var(--ui-pp-featured-glow);
}
.ui-pp__badge {
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--ui-pp-accent-soft);
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  color: var(--ui-pp-accent-text);
}
.ui-pp__name {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 16px;
  font-weight: 500;
  line-height: 22px;
  letter-spacing: -0.008em;
  color: var(--ui-pp-text);
}
.ui-pp__price {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin: 0 0 10px;
  line-height: 20px;
}
.ui-pp__amount {
  display: inline-flex;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.028em;
}
.ui-pp__digit {
  display: inline-block;
  animation: ui-pp-roll 520ms var(--ui-pp-ease) both;
}
.ui-pp__per {
  font-size: 14px;
  font-weight: 500;
  color: var(--ui-pp-text);
}
.ui-pp__rule {
  height: 1px;
  margin: 0 0 16px;
  border: 0;
  background: var(--ui-pp-line);
}

.ui-pp__limits {
  display: grid;
  gap: 12px;
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
}
.ui-pp__limits li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  line-height: 20px;
}
.ui-pp__limit-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  color: var(--ui-pp-text);
}
.ui-pp__icon { display: grid; color: var(--ui-pp-text); }
.ui-pp__limit-value { font-weight: 600; letter-spacing: -0.014em; }

/* Dark call to action with a hairline ring, like the reference */
.ui-pp__cta {
  display: grid;
  place-items: center;
  width: 100%;
  height: 28px;
  border-radius: 8px;
  background: var(--ui-pp-cta) !important;
  box-shadow: var(--ui-pp-cta-shadow);
  font-size: 14px !important;
  font-weight: 500;
  line-height: 20px;
  color: var(--ui-pp-on-cta) !important;
  transition: background-color 160ms ease, transform 160ms ease;
}
.ui-pp__cta:hover { background: var(--ui-pp-cta-hover) !important; }
.ui-pp__cta:active { transform: scale(0.99); }

.ui-pp .ui-pp__toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  width: fit-content;
  height: 24px;
  margin: 8px auto 0;
  padding: 0 8px;
  border-radius: 8px;
  font-size: 13px !important;
  font-weight: 500;
  line-height: 18px;
  color: var(--ui-pp-text) !important;
  transition: background-color 160ms ease;
}
.ui-pp__toggle:hover { background: var(--ui-pp-wash) !important; }
.ui-pp__chevron { transition: transform 320ms var(--ui-pp-ease); }
.ui-pp__toggle[aria-expanded="false"] .ui-pp__chevron { transform: rotate(180deg); }

/* Collapsible details */
.ui-pp__details {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 460ms var(--ui-pp-ease), opacity 280ms ease;
  opacity: 0;
}
.ui-pp__details[data-open] { grid-template-rows: 1fr; opacity: 1; }
.ui-pp__details-inner { min-height: 0; overflow: hidden; padding-top: 16px; }

.ui-pp__section-head,
.ui-pp__section-sub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ui-pp__eyebrow {
  font-size: 12px;
  font-weight: 500;
  line-height: 12px;
  text-transform: uppercase;
  color: var(--ui-pp-text);
}
.ui-pp__chip {
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--ui-pp-wash);
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;
  color: var(--ui-pp-text);
}
.ui-pp__section-sub {
  margin-top: 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  color: var(--ui-pp-text);
}
.ui-pp__tag {
  padding: 0 6px;
  border-radius: 6px;
  background: var(--ui-pp-accent-soft);
  color: var(--ui-pp-accent-text);
}

/* Seven tiles in one row \u2013 they shrink a little on narrow cards instead of wrapping */
.ui-pp__apps {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 28px));
  gap: 8px;
  margin-top: 8px;
}
.ui-pp__app {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: 7px;
  background: var(--ui-pp-tile);
  box-shadow: inset 0 0 0 1px var(--ui-pp-tile-line);
  color: var(--ui-pp-ink);
}
.ui-pp__app[data-filled] { box-shadow: inset 0 0 0 1px var(--ui-pp-tile-filled-line); }
.ui-pp__app svg { max-width: 58%; height: auto; }

.ui-pp__features {
  display: grid;
  gap: 8px;
  margin: 20px 0 0;
  padding: 0;
  list-style: none;
}
.ui-pp__features li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  line-height: 20px;
  color: var(--ui-pp-faint);
}
.ui-pp__features li[data-included] { color: var(--ui-pp-ink); }
.ui-pp__mark { flex: none; color: var(--ui-pp-faint); }
.ui-pp__features li[data-included] .ui-pp__mark { color: var(--ui-pp-text); }
.ui-pp__sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@keyframes ui-pp-roll {
  from { opacity: 0; transform: translateY(40%); filter: blur(2px); }
}

@media (prefers-reduced-motion: reduce) {
  .ui-pp__thumb, .ui-pp__details, .ui-pp__chevron { transition: none; }
  .ui-pp__digit { animation: none; }
}

/* Dark mode: follows a .dark class or data-theme="dark" on any ancestor, such as the document root. */
:where(.dark, [data-theme="dark"]) .ui-pp {
  --ui-pp-bg: #161618;
  --ui-pp-card: #232326;
  --ui-pp-line: rgba(255, 255, 255, 0.08);
  --ui-pp-ink: #ededed;
  --ui-pp-text: #c4c4c4;
  --ui-pp-muted: #8f8f8f;
  --ui-pp-faint: #6b6b70;
  --ui-pp-accent-text: #6b95ff;
  --ui-pp-accent-soft: rgba(47, 107, 255, 0.16);
  --ui-pp-featured-line: rgba(107, 149, 255, 0.42);
  --ui-pp-featured-glow: rgba(47, 107, 255, 0.14);
  --ui-pp-track: rgba(255, 255, 255, 0.06);
  --ui-pp-thumb: #313135;
  --ui-pp-thumb-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 1px 3px rgba(0, 0, 0, 0.45);
  --ui-pp-wash: rgba(255, 255, 255, 0.06);
  /* The call to action inverts: light button, dark label */
  --ui-pp-cta: #ededed;
  --ui-pp-cta-hover: #ffffff;
  --ui-pp-on-cta: #121213;
  --ui-pp-cta-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.4), inset 0 1px 0 #ffffff;
  --ui-pp-tile: #2a2a2d;
  --ui-pp-tile-line: rgba(255, 255, 255, 0.08);
